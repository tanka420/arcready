name: C09 R3A Prototype

on:
  pull_request:

permissions:
  contents: read

jobs:
  prototype:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Install repository dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Install exact research parser temporarily
        run: corepack pnpm add -Dw @solidity-parser/parser@0.20.2

      - name: Run C09 R3A source corpus
        run: |
          node --check docs/research/fixtures/c09-r3a-prototype.mjs
          node --check docs/research/fixtures/c09-r3a-run.mjs
          node docs/research/fixtures/c09-r3a-run.mjs

      - name: Restore dependency manifests
        run: git checkout -- package.json pnpm-lock.yaml

      - name: Format and run full repository gate
        run: |
          corepack pnpm exec prettier --check \
            docs/research/fixtures/c09-r3a-prototype.mjs \
            docs/research/fixtures/c09-r3a-run.mjs
          git diff --check
          corepack pnpm verify:full
