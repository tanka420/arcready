name: C09 R3A Inspect Parser AST

on:
  pull_request:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Install repository dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Install exact research parser temporarily
        run: corepack pnpm add -Dw @solidity-parser/parser@0.20.2

      - name: Inspect representative AST shapes
        run: |
          node --input-type=module <<'NODE'
          import parserModule from "@solidity-parser/parser";
          import { sourceCases } from "./docs/research/fixtures/c09-r2-corpus.mjs";

          const parser = parserModule.default ?? parserModule;
          const wanted = new Set([
            "SourceUnit",
            "ContractDefinition",
            "FunctionDefinition",
            "Block",
            "VariableDeclarationStatement",
            "VariableDeclaration",
            "ReturnStatement",
            "ExpressionStatement",
            "EmitStatement",
            "IfStatement",
            "ForStatement",
            "InlineAssemblyStatement",
            "AssemblyBlock",
            "AssemblyAssignment",
            "AssemblyCall",
            "MemberAccess",
            "Identifier",
            "IndexAccess",
            "BinaryOperation",
            "FunctionCall",
            "NumberLiteral"
          ]);

          function summarizeNode(node, parentType) {
            const summary = { type: node.type, parentType };
            for (const key of [
              "name",
              "memberName",
              "operator",
              "kind",
              "visibility",
              "stateMutability",
              "isConstructor",
              "range"
            ]) {
              if (node[key] !== undefined) summary[key] = node[key];
            }
            if (Array.isArray(node.variables)) {
              summary.variables = node.variables.map((item) =>
                item && typeof item === "object"
                  ? { type: item.type, name: item.name, range: item.range }
                  : item
              );
            }
            return summary;
          }

          function collect(value, parentType = null, output = []) {
            if (!value || typeof value !== "object") return output;
            if (Array.isArray(value)) {
              for (const item of value) collect(item, parentType, output);
              return output;
            }
            const currentType = typeof value.type === "string" ? value.type : parentType;
            if (typeof value.type === "string" && wanted.has(value.type)) {
              output.push(summarizeNode(value, parentType));
            }
            for (const [key, child] of Object.entries(value)) {
              if (["loc", "range"].includes(key)) continue;
              collect(child, currentType, output);
            }
            return output;
          }

          for (const id of [
            "C09-S01",
            "C09-S03",
            "C09-S04",
            "C09-S05",
            "C09-S06",
            "C09-U03",
            "C09-A05"
          ]) {
            const fixture = sourceCases.find((item) => item.id === id);
            const source = Object.values(fixture.files)[0];
            const ast = parser.parse(source, {
              loc: true,
              range: true,
              tolerant: false
            });
            console.log(`=== ${id} ===`);
            console.log(JSON.stringify(collect(ast), null, 2));
          }
          NODE
