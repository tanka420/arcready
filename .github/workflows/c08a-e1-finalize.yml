name: C08A E1 Finalize

on:
  pull_request:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Update intentional default inventory assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, got {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          cross_preset = Path("packages/arcready/test/cross-preset.test.ts")
          replace_once(
              cross_preset,
              '      "bridge/ATTESTATION_404_NOT_FATAL",\n',
              "",
              "attestation default assertion",
          )
          replace_once(
              cross_preset,
              "    expect(ruleIds).toHaveLength(17);",
              "    expect(ruleIds).toHaveLength(16);",
              "default count assertion",
          )

          replace_once(
              Path("packages/arcready/test/no-blob-tx-on-arc.test.ts"),
              '      expect(getRulesForPresets(["wallet", "bridge", "app-kit"])).toHaveLength(\n        17\n      );',
              '      expect(getRulesForPresets(["wallet", "bridge", "app-kit"])).toHaveLength(\n        16\n      );',
              "combined preset count",
          )

          replace_once(
              Path("packages/arcready/test/scan-v2-runtime.test.ts"),
              "    expect(broken.report.findings).toHaveLength(16);",
              "    expect(broken.report.findings).toHaveLength(15);",
              "DX01 finding count",
          )
          PY

      - name: Format and run focused tests
        run: |
          corepack pnpm exec prettier --write \
            packages/arcready/presets/index.ts \
            packages/arcready/src/report.ts \
            packages/arcready/test/c08a-explicit-advice-selection.test.ts \
            packages/arcready/test/cross-preset.test.ts \
            packages/arcready/test/no-blob-tx-on-arc.test.ts \
            packages/arcready/test/scan-v2-runtime.test.ts
          corepack pnpm exec prettier --check \
            packages/arcready/presets/index.ts \
            packages/arcready/src/report.ts \
            packages/arcready/test/c08a-explicit-advice-selection.test.ts \
            packages/arcready/test/cross-preset.test.ts \
            packages/arcready/test/no-blob-tx-on-arc.test.ts \
            packages/arcready/test/scan-v2-runtime.test.ts
          corepack pnpm --filter arcready exec vitest run \
            test/presets.test.ts \
            test/cross-preset.test.ts \
            test/no-blob-tx-on-arc.test.ts \
            test/scan-v2-runtime.test.ts \
            test/c08a-explicit-advice-selection.test.ts
          git diff --check

      - name: Run full repository gate
        shell: bash
        run: |
          set +e
          corepack pnpm verify:full > /tmp/c08a-e1-verify.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "==> C08A-E1 failure summary"
            grep -n -E "FAIL|AssertionError|expected|Error:|×|failed|Mismatch|Result:" /tmp/c08a-e1-verify.log | tail -n 180 || true
            echo "==> C08A-E1 final log tail"
            tail -n 260 /tmp/c08a-e1-verify.log
            exit "$status"
          fi
          cat /tmp/c08a-e1-verify.log

      - name: Upload verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c08a-e1-verify-log
          if-no-files-found: error
          retention-days: 1
          path: /tmp/c08a-e1-verify.log

      - name: Commit E1 candidate and self-clean
        run: |
          git rm .github/workflows/c08a-e1-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/arcready/presets/index.ts \
            packages/arcready/src/report.ts \
            packages/arcready/test/c08a-explicit-advice-selection.test.ts \
            packages/arcready/test/cross-preset.test.ts \
            packages/arcready/test/no-blob-tx-on-arc.test.ts \
            packages/arcready/test/scan-v2-runtime.test.ts
          git commit -m "test: lock C08A-E1 default exclusion"
          git push origin HEAD:${{ github.head_ref }}
