          printf '%s' "$PATCH_B64" | base64 --decode > /tmp/c03.patch
          echo "1c48dca78cb78e6e366454c77c85e1e1de7ede1c4b90e4f0808d6308dec56296  /tmp/c03.patch" | sha256sum -c -
