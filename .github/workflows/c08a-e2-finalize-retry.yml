name: C08A E2 Finalize Retry

on:
  pull_request:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Reapply policy patch with whitespace-safe catalog selector
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path(".github/workflows/c08a-e2-finalize.yml").read_text(
              encoding="utf-8"
          )
          marker = "          python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          script = textwrap.dedent(workflow[start:end])
          old = 'and line.startswith("| Bridge")'
          new = 'and line.lstrip().startswith("|") and "Bridge" in line'
          if script.count(old) != 1:
              raise SystemExit(
                  f"catalog selector patch: expected one match, got {script.count(old)}"
              )
          script = script.replace(old, new, 1)
          Path("/tmp/c08a-e2-policy.py").write_text(script, encoding="utf-8")
          PY

          python3 /tmp/c08a-e2-policy.py

      - name: Format and run focused policy tests
        run: |
          corepack pnpm exec prettier --write \
            packages/arcready/rules/bridge/attestation-404-not-fatal.ts \
            packages/arcready/core/rules/taxonomy.ts \
            packages/arcready/core/rules/catalog.ts \
            docs/rule-catalog.md \
            packages/arcready/test/bridge-rules.test.ts \
            packages/arcready/test/rule-taxonomy.test.ts
          corepack pnpm exec prettier --check \
            packages/arcready/rules/bridge/attestation-404-not-fatal.ts \
            packages/arcready/core/rules/taxonomy.ts \
            packages/arcready/core/rules/catalog.ts \
            docs/rule-catalog.md \
            packages/arcready/test/bridge-rules.test.ts \
            packages/arcready/test/rule-taxonomy.test.ts
          corepack pnpm --filter arcready exec vitest run \
            test/bridge-rules.test.ts \
            test/rule-taxonomy.test.ts \
            test/c08a-explicit-advice-selection.test.ts
          git diff --check

      - name: Run full repository gate
        shell: bash
        run: |
          set +e
          corepack pnpm verify:full > /tmp/c08a-e2-verify.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "==> C08A-E2 failure summary"
            grep -n -E "FAIL|AssertionError|expected|Error:|×|failed|Mismatch|Result:" /tmp/c08a-e2-verify.log | tail -n 180 || true
            echo "==> C08A-E2 final log tail"
            tail -n 260 /tmp/c08a-e2-verify.log
            exit "$status"
          fi
          cat /tmp/c08a-e2-verify.log

      - name: Upload verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c08a-e2-verify-log
          if-no-files-found: error
          retention-days: 1
          path: /tmp/c08a-e2-verify.log

      - name: Commit E2 candidate and self-clean
        run: |
          git rm \
            .github/workflows/c08a-e2-finalize.yml \
            .github/workflows/c08a-e2-finalize-retry.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/arcready/rules/bridge/attestation-404-not-fatal.ts \
            packages/arcready/core/rules/taxonomy.ts \
            packages/arcready/core/rules/catalog.ts \
            docs/rule-catalog.md \
            packages/arcready/test/bridge-rules.test.ts \
            packages/arcready/test/rule-taxonomy.test.ts
          git commit -m "test: lock C08A-E2 advisory policy"
          git push origin HEAD:${{ github.head_ref }}
