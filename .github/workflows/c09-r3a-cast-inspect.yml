name: C09 R3A Cast Inspect

on:
  pull_request:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm add -Dw @solidity-parser/parser@0.20.2
      - name: Print S02 cast node
        run: |
          node --input-type=module <<'NODE'
          import parserModule from "@solidity-parser/parser";
          import { sourceCases } from "./docs/research/fixtures/c09-r2-corpus.mjs";
          const parser = parserModule.default ?? parserModule;
          const fixture = sourceCases.find((item) => item.id === "C09-S02");
          const source = Object.values(fixture.files)[0];
          const ast = parser.parse(source, { loc: true, range: true, tolerant: false });
          let cast = null;
          const visit = (value) => {
            if (!value || typeof value !== "object" || cast) return;
            if (
              value.type === "FunctionCall" &&
              JSON.stringify(value).includes("prevrandao")
            ) {
              cast = value;
              return;
            }
            for (const child of Object.values(value)) {
              if (Array.isArray(child)) child.forEach(visit);
              else visit(child);
            }
          };
          visit(ast);
          console.log(JSON.stringify(cast, null, 2));
          NODE
