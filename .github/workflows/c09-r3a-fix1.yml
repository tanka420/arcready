name: C09 R3A Hardening 1

on:
  pull_request:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Install repository dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Install exact test-only parser
        run: |
          mkdir -p /tmp/c09-parser
          npm install \
            --prefix /tmp/c09-parser \
            --ignore-scripts \
            --no-package-lock \
            @solidity-parser/parser@0.20.2

      - name: Apply first hardening patch
        run: python3 .github/scripts/c09-r3a-fix1.py

      - name: Validate 36-case contract and repository
        run: |
          corepack pnpm exec prettier --write \
            docs/research/prototypes/c09-r3a-analyzer.mjs \
            docs/research/prototypes/c09-r3a-runner.mjs
          corepack pnpm exec prettier --check \
            docs/research/prototypes/c09-r3a-analyzer.mjs \
            docs/research/prototypes/c09-r3a-runner.mjs
          node --check docs/research/prototypes/c09-r3a-analyzer.mjs
          node --check docs/research/prototypes/c09-r3a-runner.mjs
          C09_PARSER_ROOT=/tmp/c09-parser \
            node docs/research/prototypes/c09-r3a-runner.mjs \
            > /tmp/c09-r3a-results.json
          cat /tmp/c09-r3a-results.json
          git diff --check
          corepack pnpm verify:full

      - name: Commit hardening and self-clean
        run: |
          git rm \
            .github/scripts/c09-r3a-fix1.py \
            .github/workflows/c09-r3a-fix1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/research/prototypes/c09-r3a-analyzer.mjs \
            docs/research/prototypes/c09-r3a-runner.mjs
          git commit -m "research: harden C09-R3A corpus classification"
          git push origin HEAD:${{ github.head_ref }}
