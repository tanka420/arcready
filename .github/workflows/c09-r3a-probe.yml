name: C09 R3A Parser Feasibility

on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Install repository dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Install exact test-only Solidity parser
        run: |
          mkdir -p /tmp/c09-parser
          npm install \
            --prefix /tmp/c09-parser \
            --ignore-scripts \
            --no-package-lock \
            @solidity-parser/parser@0.20.2
          test "$(node -p "require('/tmp/c09-parser/node_modules/@solidity-parser/parser/package.json').version")" = "0.20.2"

      - name: Run 36-case R3-A classification contract
        shell: bash
        run: |
          set +e
          C09_PARSER_ROOT=/tmp/c09-parser \
            node docs/research/prototypes/c09-r3a-runner.mjs \
            > /tmp/c09-r3a-results.json
          status=$?
          cat /tmp/c09-r3a-results.json
          exit "$status"

      - name: Upload R3-A result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c09-r3a-results
          retention-days: 1
          if-no-files-found: error
          path: /tmp/c09-r3a-results.json
