name: C08 R3 Ownership Hardening Retry 3

on:
  pull_request:

permissions:
  contents: write

jobs:
  complete:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Reapply hardening and replace bounded test case
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path(".github/workflows/c08-r3-ownership-hardening.yml").read_text(
              encoding="utf-8"
          )
          marker = "          python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          script = textwrap.dedent(workflow[start:end])
          Path("/tmp/c08-r3-hardening.py").write_text(script, encoding="utf-8")
          PY

          python3 /tmp/c08-r3-hardening.py

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("packages/arcready/test/c08-r3-attestation-prototype.test.mjs")
          text = path.read_text(encoding="utf-8")

          text, removed = re.subn(
              r'const SAFE_429_BRANCH = `.*?`;\n',
              '',
              text,
              count=1,
              flags=re.S,
          )
          if removed != 1:
              raise SystemExit(f"SAFE_429_BRANCH removal: expected 1, got {removed}")

          title = "fails closed when combined and separate status branches coexist"
          next_title = "keeps every unsafe control-flow candidate blocked from public emission"
          title_position = text.index(title)
          next_title_position = text.index(next_title, title_position + len(title))
          block_start = text.rfind("  it(", 0, title_position)
          block_end = text.rfind("  it(", 0, next_title_position)
          if block_start < 0 or block_end <= block_start:
              raise SystemExit(
                  f"combined test bounds invalid: start={block_start} end={block_end}"
              )

          replacement_lines = [
              '  it("fails closed when combined and separate status branches coexist", () => {',
              '    const combinedBranch = `    if (',
              '      response.status === 404 ||',
              '      response.status === 429',
              '    ) {',
              '      await new Promise((resolve) => setTimeout(resolve, 5_000));',
              '      continue;',
              '    }`;',
              '    const source = replaceExactlyOnce(',
              '      SAFE_ANCHOR,',
              '      SAFE_404_BRANCH,',
              '      `${combinedBranch}\\n\\n${SAFE_404_BRANCH}`',
              '    );',
              '    expect(classifyC08R3Source("fixture.ts", source).controlFlowClass).toBe(',
              '      "unsupported"',
              '    );',
              '  });',
              '',
          ]
          replacement = "\n".join(replacement_lines) + "\n"
          text = text[:block_start] + replacement + text[block_end:]
          path.write_text(text, encoding="utf-8")
          PY

      - name: Run focused validation
        run: |
          corepack pnpm exec prettier --write \
            docs/research/C08-R3.md \
            docs/research/fixtures/c08-r3-corpus.mjs \
            packages/arcready/test/c08-r3-attestation-prototype.mjs \
            packages/arcready/test/c08-r3-attestation-prototype.test.mjs
          corepack pnpm exec prettier --check \
            docs/research/C08-R3.md \
            docs/research/fixtures/c08-r3-corpus.mjs \
            packages/arcready/test/c08-r3-attestation-prototype.mjs \
            packages/arcready/test/c08-r3-attestation-prototype.test.mjs
          corepack pnpm --filter arcready exec vitest run test/c08-r3-attestation-prototype.test.mjs
          git diff --check

      - name: Commit hardening and self-clean
        run: |
          git rm \
            .github/workflows/c08-r3-ownership-hardening.yml \
            .github/workflows/c08-r3-ownership-hardening-retry.yml \
            .github/workflows/c08-r3-ownership-hardening-retry2.yml \
            .github/workflows/c08-r3-ownership-hardening-retry3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/arcready/test/c08-r3-attestation-prototype.mjs \
            packages/arcready/test/c08-r3-attestation-prototype.test.mjs
          git commit -m "test: prove C08-R3 structural ownership"
          git push origin HEAD:${{ github.head_ref }}
