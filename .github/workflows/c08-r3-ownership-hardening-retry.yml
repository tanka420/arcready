name: C08 R3 Ownership Hardening Retry

on:
  pull_request:

permissions:
  contents: write

jobs:
  retry:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Reapply hardening and fix adversarial fixture
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path(".github/workflows/c08-r3-ownership-hardening.yml").read_text(
              encoding="utf-8"
          )
          marker = "          python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          script = textwrap.dedent(workflow[start:end])
          Path("/tmp/c08-r3-hardening.py").write_text(script, encoding="utf-8")
          PY

          python3 /tmp/c08-r3-hardening.py

          python3 - <<'PY'
          from pathlib import Path

          path = Path("packages/arcready/test/c08-r3-attestation-prototype.test.mjs")
          text = path.read_text(encoding="utf-8")
          old = '''const SAFE_429_BRANCH = `    if (response.status === 429) {
            await new Promise((resolve) => setTimeout(resolve, 10_000));
            continue;
          }`;'''
          new = '''const SAFE_429_BRANCH = `    if (response.status === 429) {
              await new Promise((resolve) => setTimeout(resolve, 10_000));
              continue;
            }`;'''
          if text.count(old) != 1:
              raise SystemExit(
                  f"SAFE_429_BRANCH indentation: expected one match, got {text.count(old)}"
              )
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Run focused validation
        run: |
          corepack pnpm exec prettier --write \
            docs/research/C08-R3.md \
            docs/research/fixtures/c08-r3-corpus.mjs \
            packages/arcready/test/c08-r3-attestation-prototype.mjs \
            packages/arcready/test/c08-r3-attestation-prototype.test.mjs
          corepack pnpm exec prettier --check \
            docs/research/C08-R3.md \
            docs/research/fixtures/c08-r3-corpus.mjs \
            packages/arcready/test/c08-r3-attestation-prototype.mjs \
            packages/arcready/test/c08-r3-attestation-prototype.test.mjs
          corepack pnpm --filter arcready exec vitest run test/c08-r3-attestation-prototype.test.mjs
          git diff --check

      - name: Commit hardening and self-clean
        run: |
          git rm \
            .github/workflows/c08-r3-ownership-hardening.yml \
            .github/workflows/c08-r3-ownership-hardening-retry.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/arcready/test/c08-r3-attestation-prototype.mjs \
            packages/arcready/test/c08-r3-attestation-prototype.test.mjs
          git commit -m "test: prove C08-R3 structural ownership"
          git push origin HEAD:${{ github.head_ref }}
