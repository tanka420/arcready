name: C09 R3A Fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Install repository dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Apply exact classifier fixes
        run: python3 .github/scripts/c09-r3a-fix.py

      - name: Install exact research parser temporarily
        run: corepack pnpm add -Dw @solidity-parser/parser@0.20.2

      - name: Validate corrected source corpus
        run: |
          corepack pnpm exec prettier --write \
            docs/research/fixtures/c09-r3a-prototype.mjs \
            docs/research/fixtures/c09-r3a-run.mjs
          node --check docs/research/fixtures/c09-r3a-prototype.mjs
          node --check docs/research/fixtures/c09-r3a-run.mjs
          node docs/research/fixtures/c09-r3a-run.mjs
          git checkout -- package.json pnpm-lock.yaml
          corepack pnpm exec prettier --check \
            docs/research/fixtures/c09-r3a-prototype.mjs \
            docs/research/fixtures/c09-r3a-run.mjs
          git diff --check
          corepack pnpm verify:full

      - name: Commit fixes and self-clean
        run: |
          git rm \
            .github/scripts/c09-r3a-fix.py \
            .github/workflows/c09-r3a-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/research/fixtures/c09-r3a-prototype.mjs \
            docs/research/fixtures/c09-r3a-run.mjs
          git commit -m "research: correct C09 R3A ownership classification"
          git push origin HEAD:${{ github.head_ref }}
