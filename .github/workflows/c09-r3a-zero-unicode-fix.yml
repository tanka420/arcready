name: C09 R3A Zero and Unicode Hardening

on:
  pull_request:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Install repository dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Install exact test-only parser
        run: |
          mkdir -p /tmp/c09-parser
          npm install \
            --prefix /tmp/c09-parser \
            --ignore-scripts \
            --no-package-lock \
            @solidity-parser/parser@0.20.2

      - name: Apply zero-check and Unicode masking patch
        run: python3 .github/scripts/c09-r3a-zero-unicode-fix.py

      - name: Validate all R3-A contracts and repository
        shell: bash
        run: |
          corepack pnpm exec prettier --write \
            docs/research/prototypes/c09-r3a-analyzer.mjs \
            docs/research/prototypes/c09-r3a-runner.mjs \
            docs/research/prototypes/c09-r3a-adversarial.mjs \
            docs/research/prototypes/c09-r3a-adversarial-extended.mjs
          corepack pnpm exec prettier --check \
            docs/research/prototypes/c09-r3a-analyzer.mjs \
            docs/research/prototypes/c09-r3a-runner.mjs \
            docs/research/prototypes/c09-r3a-adversarial.mjs \
            docs/research/prototypes/c09-r3a-adversarial-extended.mjs
          node --check docs/research/prototypes/c09-r3a-analyzer.mjs
          node --check docs/research/prototypes/c09-r3a-runner.mjs
          node --check docs/research/prototypes/c09-r3a-adversarial.mjs
          node --check docs/research/prototypes/c09-r3a-adversarial-extended.mjs

          set +e
          C09_PARSER_ROOT=/tmp/c09-parser \
            node docs/research/prototypes/c09-r3a-runner.mjs \
            > /tmp/c09-r3a-results.json
          corpus_status=$?
          C09_PARSER_ROOT=/tmp/c09-parser \
            node docs/research/prototypes/c09-r3a-adversarial.mjs \
            > /tmp/c09-r3a-adversarial.json
          adversarial_status=$?
          C09_PARSER_ROOT=/tmp/c09-parser \
            node docs/research/prototypes/c09-r3a-adversarial-extended.mjs \
            > /tmp/c09-r3a-adversarial-extended.json
          extended_status=$?
          set -e

          cat /tmp/c09-r3a-results.json
          cat /tmp/c09-r3a-adversarial.json
          cat /tmp/c09-r3a-adversarial-extended.json

          if [ "$corpus_status" -ne 0 ] || \
             [ "$adversarial_status" -ne 0 ] || \
             [ "$extended_status" -ne 0 ]; then
            echo "classification status: corpus=$corpus_status adversarial=$adversarial_status extended=$extended_status"
            exit 1
          fi

          git diff --check
          corepack pnpm verify:full

      - name: Commit hardening and self-clean
        run: |
          git rm \
            .github/scripts/c09-r3a-zero-unicode-fix.py \
            .github/workflows/c09-r3a-zero-unicode-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/research/prototypes/c09-r3a-analyzer.mjs \
            docs/research/prototypes/c09-r3a-runner.mjs \
            docs/research/prototypes/c09-r3a-adversarial.mjs \
            docs/research/prototypes/c09-r3a-adversarial-extended.mjs
          git commit -m "research: harden C09-R3A zero and Unicode handling"
          git push origin HEAD:${{ github.head_ref }}
