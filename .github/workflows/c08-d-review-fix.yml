name: C08 D Review Fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Apply exact review corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, got {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          decision = Path("docs/research/C08-D.md")
          replace_once(
              decision,
              "The current rule is:\n\n- exported publicly;\n- included in `bridgeRules`;\n- selected by the default bridge preset;",
              "The current rule is:\n\n- exported publicly;\n- included in `bridgeRules`, which is the all-known public bridge inventory;\n- selected by the default bridge preset because `defaultPresetRegistry` currently\n  consumes that same array;",
              "decision current dual role",
          )
          replace_once(
              decision,
              "### 6.1 Default exclusion\n\n- remove `attestation404NotFatalRule` from the default bridge preset list;\n- retain the public rule export and known inventory entry during the\n  compatibility period;\n- reduce the default known-rule inventory from 17 to 16 while keeping 19 known,\n  7 wallet, and 4 canonical rules;\n- preserve default ordering for all remaining rules.",
              "### 6.1 Known/default inventory split\n\n- keep `bridgeRules` unchanged as the all-known public bridge array, including\n  `attestation404NotFatalRule`;\n- introduce one private `bridgeDefaultPresetRules` subset used only by\n  `defaultPresetRegistry`;\n- exclude the attestation rule only from that private default subset;\n- retain the public rule export and known inventory entry during the\n  compatibility period;\n- reduce default inventory from 17 to 16 while keeping 19 known, 7 wallet, and 4\n  canonical rules;\n- preserve default ordering for all remaining rules.",
              "decision known default split",
          )
          replace_once(
              decision,
              "### 6.2 Explicit opt-in\n\nIntroduce one narrow registry for known default-excluded rules.\n\nSelection semantics must be:\n\n1. select ordinary preset rules exactly as today;\n2. inspect only IDs in the dedicated default-excluded registry;\n3. add a known excluded rule only when `config.rules[id]` is explicitly present\n   with `info`, `warning`, or `critical`;\n4. do not add it for missing or `off` configuration;\n5. deduplicate by rule ID;\n6. preserve deterministic registry order;\n7. do not turn arbitrary public exports or unknown config keys into runtime\n   selectors.\n\nThis is a compatibility mechanism, not a general plugin registry.",
              "### 6.2 Explicit opt-in\n\nKeep the default-excluded registry private to the module's top-level default\nselection helper. Do not attach it to every `PresetRegistry` instance.\n\nSelection semantics must be:\n\n1. obtain ordinary rules from `defaultPresetRegistry` exactly as today;\n2. inspect only IDs in the private built-in default-excluded registry;\n3. add a known excluded rule only when `config.rules[id]` is explicitly present\n   with `info`, `warning`, or `critical`;\n4. do not add it for missing or `off` configuration;\n5. deduplicate by rule ID;\n6. preserve deterministic private-registry order;\n7. do not turn arbitrary public exports or unknown config keys into runtime\n   selectors;\n8. leave `PresetRegistry` and custom `createPresetRegistry()` instance behavior\n   unchanged, with no automatic built-in excluded rules.\n\nThis is a compatibility mechanism in the top-level default helper, not a general\nplugin or custom-registry API.",
              "decision opt in isolation",
          )
          replace_once(
              decision,
              "- the default bridge preset excludes the rule;\n- normal bridge scans no longer execute or emit it;",
              "- `bridgeRules` still includes the public known rule ID;\n- the private default bridge subset and default bridge preset exclude the rule;\n- normal bridge scans no longer execute or emit it;",
              "decision compatibility tests known default",
          )
          replace_once(
              decision,
              "- unknown rule IDs remain non-selecting;\n- public exports remain available;",
              "- unknown rule IDs remain non-selecting;\n- custom `createPresetRegistry()` instances never receive built-in excluded\n  rules;\n- public exports remain available;",
              "decision custom isolation test",
          )
          replace_once(
              decision,
              "- remove it from the preset without providing real explicit opt-in;",
              "- remove it from public `bridgeRules` instead of splitting known and default\n  arrays;\n- remove it from the preset without providing real explicit opt-in;",
              "decision rejected split shortcut",
          )

          plan = Path("docs/exec-plans/active/C08A.md")
          replace_once(
              plan,
              "- `attestation404NotFatalRule` is included in `bridgeRules`;\n- the default bridge preset schedules it;",
              "- `attestation404NotFatalRule` is included in `bridgeRules`;\n- `bridgeRules` currently serves both the public all-known bridge inventory and\n  the default bridge preset source;\n- the default bridge preset therefore schedules it;",
              "plan current dual role",
          )
          replace_once(
              plan,
              "- the rule is not selected;\n- it emits no findings;",
              "- public `bridgeRules` still includes the known rule ID;\n- the private default bridge subset does not include the rule;\n- the rule is not selected by a normal default scan;\n- it emits no findings;",
              "plan target known default",
          )
          replace_once(
              plan,
              "### 5.1 Default preset registry\n\nKeep ordinary preset selection unchanged.\n\nRemove only `attestation404NotFatalRule` from the default bridge preset array.\nDo not reorder other bridge rules.\n\n### 5.2 Default-excluded registry\n\nAdd one private deterministic registry such as:\n\n```text\ndefaultExcludedRulesById\n```\n\nThe registry initially contains only:\n\n```text\nbridge/ATTESTATION_404_NOT_FATAL\n```\n\nIt is not a general plugin API and is not exported publicly.\n\n### 5.3 Explicit selection\n\nExtend scan selection with the configured rule-level map.\n\nFor each known default-excluded rule in registry order:\n\n- add it when the configured level is `info`, `warning`, or `critical`;\n- omit it when missing or `off`;\n- deduplicate against ordinary preset selection by ID.\n\nDo not iterate arbitrary config IDs to discover public exports. Do not throw on\nunknown IDs or change config validation semantics.\n\n### 5.4 API shape\n\nPrefer one explicit internal selection input rather than hidden global state.\nFor example, extend `getRulesForScan` and `PresetRegistry.getRulesForScan` with a\nconfigured rule-level map or a small options object.\n\nThe public TypeScript signature may change only if required by the existing\nexported helper. If changed, preserve source compatibility where practical by\nusing an optional argument with an empty default.\n\n`runScan` must pass `config.rules` into selection.",
              "### 5.1 Known/default bridge split\n\nKeep `bridgeRules` unchanged as the all-known public bridge array, including the\nattestation rule.\n\nCreate one private `bridgeDefaultPresetRules` subset in the preset module and\nuse it only when constructing `defaultPresetRegistry`. Exclude only\n`attestation404NotFatalRule` from that subset. Do not reorder the remaining\nbridge rules.\n\nThis follows the existing separation between `appKitRules` and\n`appKitDefaultPresetRules`.\n\n### 5.2 Private built-in default-excluded registry\n\nAdd one private deterministic registry such as:\n\n```text\ndefaultExcludedRulesById\n```\n\nThe registry initially contains only:\n\n```text\nbridge/ATTESTATION_404_NOT_FATAL\n```\n\nThe registry belongs to the module's top-level default-selection path. It is not\nattached to `PresetRegistry`, passed implicitly into `createPresetRegistry()`, or\nexported publicly.\n\n### 5.3 Explicit top-level selection\n\nExtend only the top-level default helper with the configured rule-level map:\n\n```text\ngetRulesForScan(configuredPresets, detection, configuredRules = {})\n```\n\nThe helper must:\n\n1. obtain ordinary rules from `defaultPresetRegistry.getRulesForScan(...)`;\n2. append each known default-excluded rule whose configured level is `info`,\n   `warning`, or `critical`;\n3. omit missing and `off` entries;\n4. deduplicate by rule ID;\n5. preserve deterministic private-registry order.\n\nDo not iterate arbitrary config IDs to discover public exports. Do not throw on\nunknown IDs or change config validation semantics.\n\n### 5.4 Public API and custom-registry isolation\n\nKeep `PresetRegistry` and `createPresetRegistry()` instance signatures and\nbehavior unchanged. Custom registries must never receive built-in excluded rules\nimplicitly.\n\nExtend only the already-exported top-level `getRulesForScan` function with an\noptional third argument defaulting to an empty map. This preserves existing\ntwo-argument source compatibility.\n\n`runScan` must pass `config.rules` into that top-level helper.",
              "plan architecture replacement",
          )
          replace_once(
              plan,
              "- remove the rule from default bridge selection;\n- add the one-rule default-excluded registry;\n- extend rule selection with explicit configured levels;",
              "- keep `bridgeRules` as all-known inventory and add the private default bridge\n  subset;\n- add the one-rule private built-in default-excluded registry;\n- extend only top-level default rule selection with explicit configured levels;",
              "plan E1 scope",
          )
          replace_once(
              plan,
              "- default bridge preset excludes the rule;\n- explicit `info`, `warning`, and `critical` select it once;",
              "- public `bridgeRules` retains the ID while the default bridge subset excludes\n  it;\n- default bridge preset excludes the rule;\n- explicit `info`, `warning`, and `critical` select it once through the top-level\n  default helper;",
              "plan E1 acceptance known default",
          )
          replace_once(
              plan,
              "- unknown IDs do not select anything;\n- remaining preset order and deduplication are byte-for-byte stable where",
              "- unknown IDs do not select anything;\n- custom registry instances never receive the built-in excluded rule;\n- remaining preset order and deduplication are byte-for-byte stable where",
              "plan E1 custom isolation",
          )
          replace_once(
              plan,
              "- default bridge preset excludes the ID;\n- bridge plus wallet/app-kit presets preserve order and deduplication;",
              "- `bridgeRules` retains the known ID;\n- the private default bridge subset and default bridge preset exclude the ID;\n- bridge plus wallet/app-kit presets preserve order and deduplication;",
              "plan selection tests split",
          )
          replace_once(
              plan,
              "- unknown ID does not select a rule;\n- duplicate preset/default-excluded registration executes once;",
              "- unknown ID does not select a rule;\n- a custom `createPresetRegistry()` instance does not receive the built-in\n  excluded rule;\n- duplicate preset/default-excluded selection executes once;",
              "plan selection tests custom",
          )
          replace_once(
              plan,
              "- public rule export remains available;\n- default bridge rule order excluding the removed ID is pinned;",
              "- public rule export and `bridgeRules` inventory entry remain available;\n- private default bridge rule order excluding the ID is pinned;",
              "plan regression known default",
          )
          replace_once(
              plan,
              "- a generic plugin or arbitrary rule registry;",
              "- a generic plugin or arbitrary rule registry;\n- changes to `PresetRegistry` or custom `createPresetRegistry()` semantics;",
              "plan non goal custom registry",
          )
          PY

      - name: Format and validate corrected docs
        run: |
          corepack pnpm exec prettier --write \
            docs/research/C08-D.md \
            docs/exec-plans/active/C08A.md
          corepack pnpm exec prettier --check \
            docs/research/C08-D.md \
            docs/exec-plans/active/C08.md \
            docs/exec-plans/active/C08A.md \
            docs/roadmap.md \
            docs/rule-development-backlog.md
          git diff --check

      - name: Commit corrections and self-clean
        run: |
          git rm .github/workflows/c08-d-review-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/research/C08-D.md \
            docs/exec-plans/active/C08A.md
          git commit -m "docs: isolate C08A default rule selection"
          git push origin HEAD:${{ github.head_ref }}
