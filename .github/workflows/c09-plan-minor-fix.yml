name: C09 Plan Minor Fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Fix remaining terminology
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("docs/exec-plans/active/C09.md")
          text = path.read_text(encoding="utf-8")
          old = "- one immutable local seed binding then direct modulo;"
          new = "- one single-assignment local seed binding then direct modulo;"
          if text.count(old) != 1:
              raise SystemExit(f"expected one remaining terminology match, got {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          corepack pnpm exec prettier --write docs/exec-plans/active/C09.md
          corepack pnpm exec prettier --check docs/exec-plans/active/C09.md
          git diff --check

      - name: Commit correction and self-clean
        run: |
          git rm .github/workflows/c09-plan-minor-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/exec-plans/active/C09.md
          git commit -m "docs: use precise C09 local-binding terminology"
          git push origin HEAD:${{ github.head_ref }}
