name: C08 R3 Report Finalize

on:
  pull_request:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Finalize report evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("docs/research/C08-R3.md")
          text = path.read_text(encoding="utf-8")

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, got {count}")
              text = text.replace(old, new, 1)

          replace_once(
              "Status: Review candidate",
              "Status: Complete",
              "status",
          )

          replace_once(
              "Base SHA: `1b8c0ceea930ecd39d4766030315fd2516677bf4`\n\nLast reviewed:",
              "Base SHA: `1b8c0ceea930ecd39d4766030315fd2516677bf4`\n\nFinal reviewed prototype head: `8de55ad557acd0716300c1c5eeea444b05b17fc5`\n\nLast reviewed:",
              "reviewed head",
          )

          replace_once(
              "- one explicit R3 corpus erratum invariant;\n- one invariant that every unsafe candidate remains blocked from public emission.",
              "- one explicit R3 corpus erratum invariant;\n- ten adversarial ownership and policy tests;\n- one invariant that every unsafe candidate remains blocked from public emission.",
              "decision test inventory",
          )

          old_contract = (
              "The Vitest contract contains 53 passing tests:\n\n"
              "- 51 case classifications;\n"
              "- 1 erratum invariant;\n"
              "- 1 public-emission blocking invariant."
          )
          new_contract = (
              "The final Vitest contract contains 63 passing tests:\n\n"
              "- 51 case classifications;\n"
              "- 1 erratum invariant;\n"
              "- 10 adversarial ownership and policy tests;\n"
              "- 1 public-emission blocking invariant."
          )
          replace_once(old_contract, new_contract, "contract counts")

          old_repository = (
              "The full repository run at corrected head\n"
              "`2043c4a635f3f48bdf50dbdfa45108b94a1e67d4` passed:\n\n"
              "```text\n"
              "34 test files\n"
              "2282 tests\n"
              "```"
          )
          new_repository = (
              "The full repository run at final reviewed prototype head\n"
              "`8de55ad557acd0716300c1c5eeea444b05b17fc5` passed:\n\n"
              "```text\n"
              "34 test files\n"
              "2292 tests\n"
              "```"
          )
          replace_once(old_repository, new_repository, "repository counts")

          old_correction = (
              "### 4.3 Public eligibility failure was consequential, not independent\n\n"
              "The initial aggregate eligibility assertion failed only because two owned unsafe\n"
              "cases were incorrectly labeled unsupported. After correction, all 11 unsafe\n"
              "cases are classified correctly and remain blocked from public emission."
          )
          new_correction = old_correction + (
              "\n\n### 4.4 Independent review hardened structural ownership\n\n"
              "Independent review required the prototype to prove, rather than infer by\n"
              "substring or first-match behavior:\n\n"
              "- the exact Circle Iris host and V2 messages URL grammar;\n"
              "- an exact positive attempt or deadline bound;\n"
              "- top-level polling-function ownership;\n"
              "- source-wide global `fetch` ownership;\n"
              "- direct `body.messages[0]` ownership for `message`;\n"
              "- exactly one branch for every modeled status and body state;\n"
              "- a positive retry delay; and\n"
              "- an exact complete return of `message` or `message.attestation`.\n\n"
              "Ten adversarial tests now cover wrong complete returns, duplicate status/body\n"
              "branches, deceptive host substrings, compound unbounded conditions, crossed\n"
              "message ownership, global `fetch` shadowing, nested polling helpers, zero-delay\n"
              "retry, and combined-plus-separate status handling."
          )
          replace_once(old_correction, new_correction, "review hardening")

          replace_once(
              "The prototype remains test-only and private in PR #51 for independent review.",
              "The reviewed prototype remains test-only and private in PR #51.",
              "prototype disposition",
          )

          old_validation = (
              "Evidence at corrected prototype head\n"
              "`2043c4a635f3f48bdf50dbdfa45108b94a1e67d4`:\n\n"
              "```text\n"
              "C08-R3 prototype tests: 53 passed\n"
              "Repository tests: 2282 passed\n"
              "Test files: 34 passed\n"
              "Full repository gate: passed\n"
              "Repository Verification: passed\n"
              "ArcReady Action Smoke: passed\n"
              "ArcReady Example: passed\n"
              "Candidate diff check: passed\n"
              "Clean repository check: passed\n"
              "```\n\n"
              "Required before merging PR #51:\n\n"
              "```text\n"
              "Prettier check for C08-R3.md and all R3 .mjs files\n"
              "Full CI on the final documentation commit\n"
              "Independent review with blocker, major, and minor counts\n"
              "```"
          )
          new_validation = (
              "Evidence at final reviewed prototype head\n"
              "`8de55ad557acd0716300c1c5eeea444b05b17fc5`:\n\n"
              "```text\n"
              "C08-R3 prototype tests: 63 passed\n"
              "Repository tests: 2292 passed\n"
              "Test files: 34 passed\n"
              "Workflow tests: 5 passed\n"
              "Prettier check: passed\n"
              "Full repository gate: passed\n"
              "Repository Verification: passed\n"
              "ArcReady Action Smoke: passed\n"
              "ArcReady Example: passed\n"
              "Candidate diff check: passed\n"
              "Clean repository check: passed\n"
              "```\n\n"
              "Final independent review:\n\n"
              "```text\n"
              "APPROVE\n"
              "Blocker: 0\n"
              "Major: 0\n"
              "Minor: 0\n"
              "```"
          )
          replace_once(old_validation, new_validation, "validation closeout")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Format and validate report
        run: |
          corepack pnpm exec prettier --write docs/research/C08-R3.md
          corepack pnpm exec prettier --check \
            docs/research/C08-R3.md \
            docs/research/fixtures/c08-r3-corpus.mjs \
            packages/arcready/test/c08-r3-attestation-prototype.mjs \
            packages/arcready/test/c08-r3-attestation-prototype.test.mjs
          corepack pnpm --filter arcready exec vitest run test/c08-r3-attestation-prototype.test.mjs
          git diff --check

      - name: Commit report and self-clean
        run: |
          git rm .github/workflows/c08-r3-report-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/research/C08-R3.md
          git commit -m "docs: complete C08-R3 feasibility findings"
          git push origin HEAD:${{ github.head_ref }}
