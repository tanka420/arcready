name: C08 R3 Format Export

on:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Format exact R3 artifacts
        run: |
          corepack pnpm exec prettier --write \
            docs/research/C08-R3.md \
            docs/research/fixtures/c08-r3-corpus.mjs \
            packages/arcready/test/c08-r3-attestation-prototype.mjs \
            packages/arcready/test/c08-r3-attestation-prototype.test.mjs

      - name: Verify formatted artifacts
        run: |
          corepack pnpm exec prettier --check \
            docs/research/C08-R3.md \
            docs/research/fixtures/c08-r3-corpus.mjs \
            packages/arcready/test/c08-r3-attestation-prototype.mjs \
            packages/arcready/test/c08-r3-attestation-prototype.test.mjs

      - name: Upload formatted artifacts
        uses: actions/upload-artifact@v4
        with:
          name: c08-r3-formatted
          if-no-files-found: error
          retention-days: 1
          path: |
            docs/research/C08-R3.md
            docs/research/fixtures/c08-r3-corpus.mjs
            packages/arcready/test/c08-r3-attestation-prototype.mjs
            packages/arcready/test/c08-r3-attestation-prototype.test.mjs
