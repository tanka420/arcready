name: C08 R3 Format Export

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Format exact R3 artifacts
        run: |
          corepack pnpm exec prettier --write \
            docs/research/C08-R3.md \
            docs/research/fixtures/c08-r3-corpus.mjs \
            packages/arcready/test/c08-r3-attestation-prototype.mjs \
            packages/arcready/test/c08-r3-attestation-prototype.test.mjs

      - name: Verify and commit formatted artifacts
        run: |
          corepack pnpm exec prettier --check \
            docs/research/C08-R3.md \
            docs/research/fixtures/c08-r3-corpus.mjs \
            packages/arcready/test/c08-r3-attestation-prototype.mjs \
            packages/arcready/test/c08-r3-attestation-prototype.test.mjs
          git diff --check
          git rm .github/workflows/c08-r3-format-export.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/research/C08-R3.md \
            docs/research/fixtures/c08-r3-corpus.mjs \
            packages/arcready/test/c08-r3-attestation-prototype.mjs \
            packages/arcready/test/c08-r3-attestation-prototype.test.mjs
          git commit -m "style: format C08-R3 research artifacts"
          git push origin HEAD:${{ github.head_ref }}
