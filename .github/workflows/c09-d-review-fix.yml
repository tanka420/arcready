name: C09 D Review Fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Apply decision review corrections
        run: python3 .github/scripts/c09-d-review-fix.py

      - name: Format and validate decision docs
        run: |
          corepack pnpm exec prettier --write \
            docs/research/C09-D.md \
            docs/exec-plans/active/C09.md \
            docs/exec-plans/active/C09A.md \
            docs/roadmap.md \
            docs/rule-development-backlog.md
          corepack pnpm exec prettier --check \
            docs/research/C09-D.md \
            docs/exec-plans/active/C09.md \
            docs/exec-plans/active/C09A.md \
            docs/roadmap.md \
            docs/rule-development-backlog.md
          git diff --check

      - name: Run full repository gate
        run: corepack pnpm verify:full

      - name: Commit corrected decision and self-clean
        run: |
          git rm \
            .github/workflows/c09-d-review-fix.yml \
            .github/scripts/c09-d-review-fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/research/C09-D.md \
            docs/exec-plans/active/C09.md \
            docs/exec-plans/active/C09A.md \
            docs/roadmap.md \
            docs/rule-development-backlog.md
          git commit -m "docs: finalize C09 bounded Build decision"
          git push origin HEAD:${{ github.head_ref }}
