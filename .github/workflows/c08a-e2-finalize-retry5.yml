name: C08A E2 Finalize Retry 5

on:
  pull_request:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Apply standalone line-bounded E2 patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          def clean(value: str) -> str:
              return textwrap.dedent(value).strip("\n") + "\n"

          def replace_lines(path: Path, start_match, end_match, replacement: str, label: str):
              lines = path.read_text(encoding="utf-8").splitlines(keepends=True)
              starts = [i for i, line in enumerate(lines) if start_match(line)]
              if len(starts) != 1:
                  raise SystemExit(f"{label}: start matches={len(starts)}")
              start = starts[0]
              ends = [i for i in range(start + 1, len(lines)) if end_match(lines[i])]
              if not ends:
                  raise SystemExit(f"{label}: no end match")
              end = ends[0]
              lines[start:end] = [replacement]
              path.write_text("".join(lines), encoding="utf-8")

          def replace_exact_line(path: Path, old: str, new: str, label: str):
              lines = path.read_text(encoding="utf-8").splitlines(keepends=True)
              matches = [i for i, line in enumerate(lines) if line.strip() == old]
              if len(matches) != 1:
                  raise SystemExit(f"{label}: matches={len(matches)}")
              index = matches[0]
              indent = lines[index][: len(lines[index]) - len(lines[index].lstrip())]
              lines[index] = f"{indent}{new}\n"
              path.write_text("".join(lines), encoding="utf-8")

          taxonomy = Path("packages/arcready/core/rules/taxonomy.ts")
          replace_lines(
              taxonomy,
              lambda line: line.startswith("interface AdviceMetadata extends RuleMetadataBase"),
              lambda line: line.startswith("export type RuleMetadataInput"),
              clean('''
              interface ActiveAdviceMetadata extends RuleMetadataBase {
                taxonomy: "advice";
                impact: "recommendation";
                maturity: "prototype" | "validated";
                recommendedDefaultEnabled: false;
                recommendedCiFailureEligible: false;
                deprecated: false;
              }

              interface DeprecatedAdviceMetadata extends RuleMetadataBase {
                taxonomy: "advice";
                impact: "recommendation";
                maturity: "deprecated";
                recommendedDefaultEnabled: false;
                recommendedCiFailureEligible: false;
                deprecated: true;
              }

              type AdviceMetadata = ActiveAdviceMetadata | DeprecatedAdviceMetadata;

              '''),
              "advice metadata union",
          )
          replace_lines(
              taxonomy,
              lambda line: line.strip() == 'case "advice":',
              lambda line: line.strip() == 'case "needs-research":',
              textwrap.indent(
                  clean('''
                  case "advice":
                    if (metadata.impact !== "recommendation") {
                      errors.push(`${metadata.id}: advice must use recommendation impact`);
                    }
                    if (metadata.recommendedDefaultEnabled) {
                      errors.push(`${metadata.id}: advice rules must be recommended disabled`);
                    }
                    if (metadata.deprecated !== (metadata.maturity === "deprecated")) {
                      errors.push(
                        `${metadata.id}: advice deprecation and maturity must agree`
                      );
                    }
                    break;
                  '''),
                  "    ",
              ),
              "advice validation",
          )

          catalog = Path("packages/arcready/core/rules/catalog.ts")
          catalog_lines = catalog.read_text(encoding="utf-8").splitlines(keepends=True)
          id_indexes = [
              i for i, line in enumerate(catalog_lines)
              if 'id: "bridge/ATTESTATION_404_NOT_FATAL"' in line
          ]
          next_indexes = [
              i for i, line in enumerate(catalog_lines)
              if 'id: "bridge/BRIDGE_CONFIRMATIONS_ONE"' in line
          ]
          if len(id_indexes) != 1 or len(next_indexes) != 1:
              raise SystemExit(
                  f"catalog IDs: attestation={len(id_indexes)} next={len(next_indexes)}"
              )
          id_index = id_indexes[0]
          next_index = next_indexes[0]
          entry_start = max(i for i in range(id_index) if catalog_lines[i].strip() == "{")
          entry_end = max(i for i in range(next_index) if catalog_lines[i].strip() == "{")
          if entry_end <= entry_start:
              raise SystemExit(f"catalog bounds invalid: {entry_start}, {entry_end}")
          catalog_entry = textwrap.indent(
              clean('''
              {
                id: "bridge/ATTESTATION_404_NOT_FATAL",
                category: "bridge",
                rulePacks: ["bridge-cctp", "indexer-infrastructure"],
                taxonomy: "advice",
                impact: "recommendation",
                defaultConfidence: "low",
                maturity: "deprecated",
                recommendedDefaultEnabled: false,
                recommendedCiFailureEligible: false,
                appliesTo: ["attestation-poller"],
                documentation: [
                  {
                    url: "https://developers.circle.com/cctp/howtos/resolve-stuck-attestation",
                    title: "Resolve attestation issues",
                    publisher: "Circle",
                    claim:
                      "An attestation API 404 can be an expected pending response that should continue polling, but it can also indicate incorrect request parameters.",
                    support: "direct",
                    verifiedAt: VERIFIED_AT,
                    stability: "versioned"
                  }
                ],
                rationale:
                  "The polling guidance remains useful, but HTTP 404 is conditional and the proximity regex cannot prove request provenance or control-flow ownership. C08 therefore removed the rule from default execution and retained it only as explicit deprecated advice.",
                detectorLimitations: [
                  "The regex cannot distinguish a pending attestation from incorrect domains or transaction identifiers.",
                  "Nearby retry words do not prove correct polling, positive delay, a bounded exit, or terminal-error ownership.",
                  "The detector can conflate unrelated nearby branches and can miss terminal actions that do not use its matched keywords."
                ],
                deprecated: true
              },
              '''),
              "  ",
          )
          catalog_lines[entry_start:entry_end] = [catalog_entry]
          catalog.write_text("".join(catalog_lines), encoding="utf-8")

          docs = Path("docs/rule-catalog.md")
          docs_lines = docs.read_text(encoding="utf-8").splitlines(keepends=True)
          summary_indexes = [
              i for i, line in enumerate(docs_lines)
              if "`bridge/ATTESTATION_404_NOT_FATAL`" in line and line.lstrip().startswith("|")
          ]
          if len(summary_indexes) != 1:
              raise SystemExit(f"docs summary matches={len(summary_indexes)}")
          docs_lines[summary_indexes[0]] = (
              "| Bridge  | `bridge/ATTESTATION_404_NOT_FATAL`      | Info     | "
              "Deprecated, default-excluded low-confidence guidance for suspicious terminal handling near conditional attestation `404` responses. |\n"
          )
          heading_indexes = [
              i for i, line in enumerate(docs_lines)
              if line.strip() == "### ATTESTATION_404_NOT_FATAL"
          ]
          next_heading_indexes = [
              i for i, line in enumerate(docs_lines)
              if line.strip() == "### NO_PREVRANDAO_RELAY_SELECTION"
          ]
          if len(heading_indexes) != 1 or len(next_heading_indexes) != 1:
              raise SystemExit(
                  f"docs headings: current={len(heading_indexes)} next={len(next_heading_indexes)}"
              )
          section_start = heading_indexes[0]
          section_end = next_heading_indexes[0]
          docs_section = clean('''
          ### ATTESTATION_404_NOT_FATAL

          - Preset: Bridge
          - Severity: Info by default when explicitly selected; an explicit configured level remains authoritative.
          - Runtime status: Deprecated and default-excluded. The public ID remains available for compatibility opt-in during one deprecation period.
          - What it detects: A low-confidence proximity heuristic for CCTP-related source that appears to place HTTP `404` near terminal error language without nearby pending or retry guidance.
          - Why it matters: An attestation `404` can mean that Circle Iris has not observed or processed the source burn yet, but it can also indicate an incorrect transaction hash or source domain. The status alone proves neither safe retry nor terminal failure.
          - Example suspicious pattern:

            ```ts
            async function pollAttestation(response: Response) {
              if (response.status === 404) {
                throw new Error("attestation failed");
              }
            }
            ```

          - Suggested fix: Before treating an attestation `404` as pending, verify the source burn succeeded and the transaction hash and source domain are correct. Poll with a positive delay and a bounded timeout or cancellation path; handle `429` and unexpected non-OK responses separately; and distinguish empty messages, pending, and complete states.
          - Static-analysis limitation: This deprecated detector uses text proximity. It does not prove the Circle endpoint, request parameters, source burn, response ownership, polling loop, delay, bound, body state, or terminal action. Nearby retry words can suppress unrelated fatal handling, and unrelated nearby error text can produce a finding. C08-R3 found no bounded critical analyzer with meaningful first-party coverage, so this rule is optional advice rather than a default compatibility gate.

          ''')
          docs_lines[section_start:section_end] = [docs_section]
          docs.write_text("".join(docs_lines), encoding="utf-8")

          bridge_tests = Path("packages/arcready/test/bridge-rules.test.ts")
          bridge_test = textwrap.indent(
              clean('''
              it("ATTESTATION_404_NOT_FATAL emits conditional deprecated advice", async () => {
                const findings = await runBridgeRule(
                  attestation404NotFatalRule,
                  "async function pollAttestation(response) { // CCTP attestation\\n if (response.status === 404) throw new Error('attestation failed');\\n}"
                );

                expect(attestation404NotFatalRule).toMatchObject({
                  defaultSeverity: "info",
                  description: expect.stringContaining("deprecated low-confidence")
                });
                expect(findings[0]).toMatchObject({
                  ruleId: "bridge/ATTESTATION_404_NOT_FATAL",
                  severity: "info",
                  docs: "arc-cctp-attestation",
                  message: expect.stringContaining("Deprecated CCTP guidance"),
                  suggestedFix: expect.stringContaining("verify the source burn succeeded")
                });

                const suggestedFix = findings[0]?.suggestedFix ?? "";
                expect(suggestedFix).toContain("transaction hash");
                expect(suggestedFix).toContain("source domain");
                expect(suggestedFix).toContain("positive delay");
                expect(suggestedFix).toContain("bounded timeout or cancellation");
                expect(suggestedFix).toContain("429");
                expect(suggestedFix).toContain("unexpected non-OK");
                expect(suggestedFix).toContain("empty messages");
                expect(suggestedFix).toContain("pending");
                expect(suggestedFix).toContain("complete");
                expect(suggestedFix).not.toContain(
                  "404 as a retryable pending state"
                );
              });

              '''),
              "  ",
          )
          replace_lines(
              bridge_tests,
              lambda line: "ATTESTATION_404_NOT_FATAL flags fatal 404 attestation handling" in line,
              lambda line: "ATTESTATION_404_NOT_FATAL allows pending 404 handling" in line,
              bridge_test,
              "bridge policy test",
          )

          taxonomy_tests = Path("packages/arcready/test/rule-taxonomy.test.ts")
          replace_exact_line(
              taxonomy_tests,
              '"experimental-compatibility": 13,',
              '"experimental-compatibility": 12,',
              "taxonomy experimental total",
          )
          replace_exact_line(
              taxonomy_tests,
              "advice: 4,",
              "advice: 5,",
              "taxonomy advice total",
          )
          taxonomy_contract = textwrap.indent(
              clean('''
              it("locks the reviewed deprecated-advice attestation classification", () => {
                const attestation = findMetadata("bridge/ATTESTATION_404_NOT_FATAL");

                expect(attestation).toMatchObject({
                  taxonomy: "advice",
                  impact: "recommendation",
                  defaultConfidence: "low",
                  maturity: "deprecated",
                  recommendedDefaultEnabled: false,
                  recommendedCiFailureEligible: false,
                  deprecated: true
                });
                expect(attestation.rulePacks).toEqual(
                  expect.arrayContaining(["bridge-cctp", "indexer-infrastructure"])
                );
              });

              '''),
              "  ",
          )
          replace_lines(
              taxonomy_tests,
              lambda line: "locks the owner-approved attestation classification" in line,
              lambda line: "validates taxonomy combinations" in line,
              taxonomy_contract,
              "attestation taxonomy contract",
          )
          taxonomy_lines = taxonomy_tests.read_text(encoding="utf-8").splitlines(keepends=True)
          official_indexes = [
              i for i, line in enumerate(taxonomy_lines)
              if "uses only official, dated documentation references" in line
          ]
          if len(official_indexes) != 1:
              raise SystemExit(f"official refs test matches={len(official_indexes)}")
          validation_test = textwrap.indent(
              clean('''
              it("requires advice deprecation and maturity to agree", () => {
                const activeAdvice = findMetadata("wallet/ONE_CONFIRMATION_FINAL");
                const deprecatedAdvice = findMetadata(
                  "bridge/ATTESTATION_404_NOT_FATAL"
                );

                expect(
                  validateRuleMetadata({
                    ...activeAdvice,
                    maturity: "deprecated"
                  } as unknown as RuleMetadataInput)
                ).toContain(
                  "wallet/ONE_CONFIRMATION_FINAL: advice deprecation and maturity must agree"
                );

                expect(
                  validateRuleMetadata({
                    ...deprecatedAdvice,
                    maturity: "prototype"
                  } as unknown as RuleMetadataInput)
                ).toContain(
                  "bridge/ATTESTATION_404_NOT_FATAL: advice deprecation and maturity must agree"
                );
              });

              '''),
              "  ",
          )
          taxonomy_lines[official_indexes[0]:official_indexes[0]] = [validation_test]
          taxonomy_tests.write_text("".join(taxonomy_lines), encoding="utf-8")
          PY

      - name: Format and run focused policy tests
        run: |
          corepack pnpm exec prettier --write \
            packages/arcready/rules/bridge/attestation-404-not-fatal.ts \
            packages/arcready/core/rules/taxonomy.ts \
            packages/arcready/core/rules/catalog.ts \
            docs/rule-catalog.md \
            packages/arcready/test/bridge-rules.test.ts \
            packages/arcready/test/rule-taxonomy.test.ts
          corepack pnpm exec prettier --check \
            packages/arcready/rules/bridge/attestation-404-not-fatal.ts \
            packages/arcready/core/rules/taxonomy.ts \
            packages/arcready/core/rules/catalog.ts \
            docs/rule-catalog.md \
            packages/arcready/test/bridge-rules.test.ts \
            packages/arcready/test/rule-taxonomy.test.ts
          corepack pnpm --filter arcready exec vitest run \
            test/bridge-rules.test.ts \
            test/rule-taxonomy.test.ts \
            test/c08a-explicit-advice-selection.test.ts
          git diff --check

      - name: Run full repository gate
        shell: bash
        run: |
          set +e
          corepack pnpm verify:full > /tmp/c08a-e2-verify.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "==> C08A-E2 failure summary"
            grep -n -E "FAIL|AssertionError|expected|Error:|×|failed|Mismatch|Result:" /tmp/c08a-e2-verify.log | tail -n 180 || true
            echo "==> C08A-E2 final log tail"
            tail -n 260 /tmp/c08a-e2-verify.log
            exit "$status"
          fi
          cat /tmp/c08a-e2-verify.log

      - name: Upload verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c08a-e2-verify-log
          if-no-files-found: ignore
          retention-days: 1
          path: /tmp/c08a-e2-verify.log

      - name: Commit E2 candidate and self-clean
        run: |
          git rm \
            .github/workflows/c08a-e2-finalize.yml \
            .github/workflows/c08a-e2-finalize-retry.yml \
            .github/workflows/c08a-e2-finalize-retry2.yml \
            .github/workflows/c08a-e2-finalize-retry3.yml \
            .github/workflows/c08a-e2-finalize-retry4.yml \
            .github/workflows/c08a-e2-finalize-retry5.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/arcready/rules/bridge/attestation-404-not-fatal.ts \
            packages/arcready/core/rules/taxonomy.ts \
            packages/arcready/core/rules/catalog.ts \
            docs/rule-catalog.md \
            packages/arcready/test/bridge-rules.test.ts \
            packages/arcready/test/rule-taxonomy.test.ts
          git commit -m "test: lock C08A-E2 advisory policy"
          git push origin HEAD:${{ github.head_ref }}
