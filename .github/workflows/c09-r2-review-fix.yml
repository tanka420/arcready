name: C09 R2 Review Fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Apply reviewed corpus corrections
        run: python3 .github/scripts/c09-r2-review-fix.py

      - name: Validate corpus and retained compiler output
        run: |
          corepack pnpm exec prettier --write \
            docs/research/C09-R2.md \
            docs/research/fixtures/c09-r2-corpus.mjs \
            docs/research/fixtures/c09-r2-generate-ast.mjs \
            docs/research/fixtures/c09-r2-validate-ast.mjs \
            docs/research/fixtures/c09-r2-ast-manifest.json
          corepack pnpm exec prettier --check \
            docs/research/C09-R2.md \
            docs/research/fixtures/c09-r2-corpus.mjs \
            docs/research/fixtures/c09-r2-generate-ast.mjs \
            docs/research/fixtures/c09-r2-validate-ast.mjs \
            docs/research/fixtures/c09-r2-ast-manifest.json
          node --check docs/research/fixtures/c09-r2-corpus.mjs
          node --check docs/research/fixtures/c09-r2-generate-ast.mjs
          node --check docs/research/fixtures/c09-r2-validate-ast.mjs
          node docs/research/fixtures/c09-r2-corpus.mjs
          node docs/research/fixtures/c09-r2-validate-ast.mjs
          node docs/research/fixtures/c09-r2-generate-ast.mjs --check
          git diff --check
          corepack pnpm verify:full

      - name: Commit correction and self-clean
        run: |
          git rm \
            .github/scripts/c09-r2-review-fix.py \
            .github/workflows/c09-r2-review-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/research/C09-R2.md \
            docs/research/fixtures/c09-r2-corpus.mjs \
            docs/research/fixtures/c09-r2-generate-ast.mjs \
            docs/research/fixtures/c09-r2-validate-ast.mjs \
            docs/research/fixtures/c09-r2-ast-manifest.json
          git commit -m "docs: resolve C09-R2 review findings"
          git push origin HEAD:${{ github.head_ref }}
