name: C09 Plan Review Fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Apply reviewed plan corrections
        run: python3 .github/scripts/c09-plan-review-fix.py

      - name: Validate corrected plan
        run: |
          corepack pnpm exec prettier --write docs/exec-plans/active/C09.md
          corepack pnpm exec prettier --check docs/exec-plans/active/C09.md
          git diff --check
          corepack pnpm verify:full

      - name: Commit correction and self-clean
        run: |
          git rm \
            .github/scripts/c09-plan-review-fix.py \
            .github/workflows/c09-plan-review-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/exec-plans/active/C09.md
          git commit -m "docs: resolve C09 plan review findings"
          git push origin HEAD:${{ github.head_ref }}
