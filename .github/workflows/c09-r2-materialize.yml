name: C09 R2 Materialize

on:
  pull_request:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Materialize corpus and validators
        run: |
          python3 .github/scripts/c09-r2-materialize.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path("docs/research/fixtures/c09-r2-validate-ast.mjs")
          text = path.read_text(encoding="utf-8")
          marker = 'import process from "node:process";\n'
          replacement = marker + 'import { URL } from "node:url";\n'
          if text.count(marker) != 1:
              raise SystemExit(f"URL import marker count: {text.count(marker)}")
          path.write_text(text.replace(marker, replacement, 1), encoding="utf-8")
          PY

      - name: Validate corpus structure
        run: |
          node --check docs/research/fixtures/c09-r2-corpus.mjs
          node --check docs/research/fixtures/c09-r2-validate-ast.mjs
          node --check .github/scripts/c09-r2-generate-ast.mjs
          node docs/research/fixtures/c09-r2-corpus.mjs

      - name: Generate retained compiler AST manifest
        run: |
          node .github/scripts/c09-r2-generate-ast.mjs
          node docs/research/fixtures/c09-r2-validate-ast.mjs

      - name: Format and run full repository gate
        run: |
          corepack pnpm exec prettier --write \
            docs/research/C09-R2.md \
            docs/research/fixtures/c09-r2-corpus.mjs \
            docs/research/fixtures/c09-r2-validate-ast.mjs \
            docs/research/fixtures/c09-r2-ast-manifest.json
          corepack pnpm exec prettier --check \
            docs/research/C09-R2.md \
            docs/research/fixtures/c09-r2-corpus.mjs \
            docs/research/fixtures/c09-r2-validate-ast.mjs \
            docs/research/fixtures/c09-r2-ast-manifest.json
          node docs/research/fixtures/c09-r2-corpus.mjs
          node docs/research/fixtures/c09-r2-validate-ast.mjs
          git diff --check
          corepack pnpm verify:full

      - name: Commit corpus and self-clean
        run: |
          git rm \
            .github/scripts/c09-r2-materialize.py \
            .github/scripts/c09-r2-generate-ast.mjs \
            .github/workflows/c09-r2-materialize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/research/C09-R2.md \
            docs/research/fixtures/c09-r2-corpus.mjs \
            docs/research/fixtures/c09-r2-validate-ast.mjs \
            docs/research/fixtures/c09-r2-ast-manifest.json
          git commit -m "docs: add C09-R2 source and deployment corpus"
          git push origin HEAD:${{ github.head_ref }}
