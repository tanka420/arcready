name: C08A E2 Finalize Clean

on:
  pull_request:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Apply C08A-E2 policy changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          def block(value: str) -> str:
              return textwrap.dedent(value).strip("\n") + "\n"

          def replace_between(path: str, start: str, end: str, replacement: str, label: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if text.count(start) != 1 or text.count(end) != 1:
                  raise SystemExit(
                      f"{label}: start={text.count(start)} end={text.count(end)}"
                  )
              start_index = text.index(start)
              end_index = text.index(end, start_index + len(start))
              target.write_text(
                  text[:start_index] + replacement + text[end_index:],
                  encoding="utf-8",
              )

          def replace_once(path: str, old: str, new: str, label: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, got {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          def replace_test(path: str, title: str, next_title: str, replacement: str, label: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              title_token = f'  it("{title}"'
              next_token = f'  it("{next_title}"'
              if text.count(title_token) != 1 or text.count(next_token) != 1:
                  raise SystemExit(
                      f"{label}: title={text.count(title_token)} next={text.count(next_token)}"
                  )
              start_index = text.index(title_token)
              end_index = text.index(next_token, start_index)
              target.write_text(
                  text[:start_index] + replacement + text[end_index:],
                  encoding="utf-8",
              )

          replace_between(
              "packages/arcready/core/rules/taxonomy.ts",
              "interface AdviceMetadata extends RuleMetadataBase {",
              "interface NeedsResearchMetadata extends RuleMetadataBase {",
              block('''
              interface ActiveAdviceMetadata extends RuleMetadataBase {
                taxonomy: "advice";
                impact: "recommendation";
                maturity: "prototype" | "validated";
                recommendedDefaultEnabled: false;
                recommendedCiFailureEligible: false;
                deprecated: false;
              }

              interface DeprecatedAdviceMetadata extends RuleMetadataBase {
                taxonomy: "advice";
                impact: "recommendation";
                maturity: "deprecated";
                recommendedDefaultEnabled: false;
                recommendedCiFailureEligible: false;
                deprecated: true;
              }

              type AdviceMetadata = ActiveAdviceMetadata | DeprecatedAdviceMetadata;

              '''),
              "taxonomy advice union",
          )

          replace_between(
              "packages/arcready/core/rules/taxonomy.ts",
              '    case "advice":',
              '    case "needs-research":',
              textwrap.indent(
                  block('''
                  case "advice":
                    if (metadata.impact !== "recommendation") {
                      errors.push(`${metadata.id}: advice must use recommendation impact`);
                    }
                    if (metadata.recommendedDefaultEnabled) {
                      errors.push(`${metadata.id}: advice rules must be recommended disabled`);
                    }
                    if (metadata.deprecated !== (metadata.maturity === "deprecated")) {
                      errors.push(
                        `${metadata.id}: advice deprecation and maturity must agree`
                      );
                    }
                    break;
                  '''),
                  "    ",
              ),
              "taxonomy advice validator",
          )

          replace_between(
              "packages/arcready/core/rules/catalog.ts",
              '  {\n    id: "bridge/ATTESTATION_404_NOT_FATAL",',
              '  {\n    id: "bridge/BRIDGE_CONFIRMATIONS_ONE",',
              textwrap.indent(
                  block('''
                  {
                    id: "bridge/ATTESTATION_404_NOT_FATAL",
                    category: "bridge",
                    rulePacks: ["bridge-cctp", "indexer-infrastructure"],
                    taxonomy: "advice",
                    impact: "recommendation",
                    defaultConfidence: "low",
                    maturity: "deprecated",
                    recommendedDefaultEnabled: false,
                    recommendedCiFailureEligible: false,
                    appliesTo: ["attestation-poller"],
                    documentation: [
                      {
                        url: "https://developers.circle.com/cctp/howtos/resolve-stuck-attestation",
                        title: "Resolve attestation issues",
                        publisher: "Circle",
                        claim:
                          "An attestation API 404 can be an expected pending response that should continue polling, but it can also indicate incorrect request parameters.",
                        support: "direct",
                        verifiedAt: VERIFIED_AT,
                        stability: "versioned"
                      }
                    ],
                    rationale:
                      "The polling guidance remains useful, but HTTP 404 is conditional and the proximity regex cannot prove request provenance or control-flow ownership. C08 therefore removed the rule from default execution and retained it only as explicit deprecated advice.",
                    detectorLimitations: [
                      "The regex cannot distinguish a pending attestation from incorrect domains or transaction identifiers.",
                      "Nearby retry words do not prove correct polling, positive delay, a bounded exit, or terminal-error ownership.",
                      "The detector can conflate unrelated nearby branches and can miss terminal actions that do not use its matched keywords."
                    ],
                    deprecated: true
                  },
                  '''),
                  "  ",
              ),
              "runtime catalog entry",
          )

          docs_path = "docs/rule-catalog.md"
          docs = Path(docs_path)
          docs_lines = docs.read_text(encoding="utf-8").splitlines()
          row_indexes = [
              index
              for index, line in enumerate(docs_lines)
              if "`bridge/ATTESTATION_404_NOT_FATAL`" in line
              and line.startswith("| Bridge")
          ]
          if len(row_indexes) != 1:
              raise SystemExit(f"docs summary row: matches={len(row_indexes)}")
          docs_lines[row_indexes[0]] = (
              "| Bridge  | `bridge/ATTESTATION_404_NOT_FATAL`      | Info     | "
              "Deprecated, default-excluded low-confidence guidance for suspicious terminal handling near conditional attestation `404` responses. |"
          )
          docs.write_text("\n".join(docs_lines) + "\n", encoding="utf-8")

          replace_between(
              docs_path,
              "### ATTESTATION_404_NOT_FATAL\n",
              "### NO_PREVRANDAO_RELAY_SELECTION\n",
              block('''
              ### ATTESTATION_404_NOT_FATAL

              - Preset: Bridge
              - Severity: Info by default when explicitly selected; an explicit configured level remains authoritative.
              - Runtime status: Deprecated and default-excluded. The public ID remains available for compatibility opt-in during one deprecation period.
              - What it detects: A low-confidence proximity heuristic for CCTP-related source that appears to place HTTP `404` near terminal error language without nearby pending or retry guidance.
              - Why it matters: An attestation `404` can mean that Circle Iris has not observed or processed the source burn yet, but it can also indicate an incorrect transaction hash or source domain. The status alone proves neither safe retry nor terminal failure.
              - Example suspicious pattern:

                ```ts
                async function pollAttestation(response: Response) {
                  if (response.status === 404) {
                    throw new Error("attestation failed");
                  }
                }
                ```

              - Suggested fix: Before treating an attestation `404` as pending, verify the source burn succeeded and the transaction hash and source domain are correct. Poll with a positive delay and a bounded timeout or cancellation path; handle `429` and unexpected non-OK responses separately; and distinguish empty messages, pending, and complete states.
              - Static-analysis limitation: This deprecated detector uses text proximity. It does not prove the Circle endpoint, request parameters, source burn, response ownership, polling loop, delay, bound, body state, or terminal action. Nearby retry words can suppress unrelated fatal handling, and unrelated nearby error text can produce a finding. C08-R3 found no bounded critical analyzer with meaningful first-party coverage, so this rule is optional advice rather than a default compatibility gate.

              '''),
              "docs attestation section",
          )

          replace_test(
              "packages/arcready/test/bridge-rules.test.ts",
              "ATTESTATION_404_NOT_FATAL flags fatal 404 attestation handling",
              "ATTESTATION_404_NOT_FATAL allows pending 404 handling",
              textwrap.indent(
                  block('''
                  it("ATTESTATION_404_NOT_FATAL emits conditional deprecated advice", async () => {
                    const findings = await runBridgeRule(
                      attestation404NotFatalRule,
                      "async function pollAttestation(response) { // CCTP attestation\\n if (response.status === 404) throw new Error('attestation failed');\\n}"
                    );

                    expect(attestation404NotFatalRule).toMatchObject({
                      defaultSeverity: "info",
                      description: expect.stringContaining("deprecated low-confidence")
                    });
                    expect(findings[0]).toMatchObject({
                      ruleId: "bridge/ATTESTATION_404_NOT_FATAL",
                      severity: "info",
                      docs: "arc-cctp-attestation",
                      message: expect.stringContaining("Deprecated CCTP guidance"),
                      suggestedFix: expect.stringContaining("verify the source burn succeeded")
                    });

                    const suggestedFix = findings[0]?.suggestedFix ?? "";
                    expect(suggestedFix).toContain("transaction hash");
                    expect(suggestedFix).toContain("source domain");
                    expect(suggestedFix).toContain("positive delay");
                    expect(suggestedFix).toContain("bounded timeout or cancellation");
                    expect(suggestedFix).toContain("429");
                    expect(suggestedFix).toContain("unexpected non-OK");
                    expect(suggestedFix).toContain("empty messages");
                    expect(suggestedFix).toContain("pending");
                    expect(suggestedFix).toContain("complete");
                    expect(suggestedFix).not.toContain(
                      "404 as a retryable pending state"
                    );
                  });

                  '''),
                  "  ",
              ),
              "bridge policy test",
          )

          taxonomy_test = "packages/arcready/test/rule-taxonomy.test.ts"
          replace_once(
              taxonomy_test,
              '      "experimental-compatibility": 13,',
              '      "experimental-compatibility": 12,',
              "experimental total",
          )
          replace_once(
              taxonomy_test,
              "      advice: 4,",
              "      advice: 5,",
              "advice total",
          )

          replace_test(
              taxonomy_test,
              "locks the owner-approved attestation classification",
              "does not expose taxonomy metadata through the public package API",
              textwrap.indent(
                  block('''
                  it("locks the reviewed deprecated-advice attestation classification", () => {
                    const attestation = findMetadata("bridge/ATTESTATION_404_NOT_FATAL");

                    expect(attestation).toMatchObject({
                      taxonomy: "advice",
                      impact: "recommendation",
                      defaultConfidence: "low",
                      maturity: "deprecated",
                      recommendedDefaultEnabled: false,
                      recommendedCiFailureEligible: false,
                      deprecated: true
                    });
                    expect(attestation.rulePacks).toEqual(
                      expect.arrayContaining(["bridge-cctp", "indexer-infrastructure"])
                    );
                  });

                  '''),
                  "  ",
              ),
              "attestation taxonomy test",
          )

          invariant = textwrap.indent(
              block('''
              it("requires advice deprecation and maturity to agree", () => {
                const activeAdvice = findMetadata("wallet/ONE_CONFIRMATION_FINAL");
                const deprecatedAdvice = findMetadata(
                  "bridge/ATTESTATION_404_NOT_FATAL"
                );

                expect(
                  validateRuleMetadata({
                    ...activeAdvice,
                    maturity: "deprecated"
                  } as unknown as RuleMetadataInput)
                ).toContain(
                  "wallet/ONE_CONFIRMATION_FINAL: advice deprecation and maturity must agree"
                );

                expect(
                  validateRuleMetadata({
                    ...deprecatedAdvice,
                    maturity: "prototype"
                  } as unknown as RuleMetadataInput)
                ).toContain(
                  "bridge/ATTESTATION_404_NOT_FATAL: advice deprecation and maturity must agree"
                );
              });

              '''),
              "  ",
          )
          replace_once(
              taxonomy_test,
              '  it("uses only official, dated documentation references", () => {',
              invariant + '  it("uses only official, dated documentation references", () => {',
              "advice invariant test",
          )
          PY

      - name: Format changed files
        run: |
          corepack pnpm exec prettier --write \
            packages/arcready/rules/bridge/attestation-404-not-fatal.ts \
            packages/arcready/core/rules/taxonomy.ts \
            packages/arcready/core/rules/catalog.ts \
            docs/rule-catalog.md \
            packages/arcready/test/bridge-rules.test.ts \
            packages/arcready/test/rule-taxonomy.test.ts
          corepack pnpm exec prettier --check \
            packages/arcready/rules/bridge/attestation-404-not-fatal.ts \
            packages/arcready/core/rules/taxonomy.ts \
            packages/arcready/core/rules/catalog.ts \
            docs/rule-catalog.md \
            packages/arcready/test/bridge-rules.test.ts \
            packages/arcready/test/rule-taxonomy.test.ts
          git diff --check

      - name: Run focused E2 tests
        run: |
          corepack pnpm --filter arcready exec vitest run \
            test/bridge-rules.test.ts \
            test/rule-taxonomy.test.ts \
            test/c08a-explicit-advice-selection.test.ts

      - name: Run full repository gate
        run: corepack pnpm verify:full

      - name: Commit clean E2 candidate
        run: |
          git rm .github/workflows/c08a-e2-finalize-clean.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/arcready/rules/bridge/attestation-404-not-fatal.ts \
            packages/arcready/core/rules/taxonomy.ts \
            packages/arcready/core/rules/catalog.ts \
            docs/rule-catalog.md \
            packages/arcready/test/bridge-rules.test.ts \
            packages/arcready/test/rule-taxonomy.test.ts
          git commit -m "feat: finalize C08A-E2 advisory policy"
          git push origin HEAD:${{ github.head_ref }}
