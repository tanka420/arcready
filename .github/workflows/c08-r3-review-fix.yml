name: C08 R3 Review Fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Apply exact review corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, got {count}")
              return text.replace(old, new, 1)

          prototype_path = Path("packages/arcready/test/c08-r3-attestation-prototype.mjs")
          prototype = prototype_path.read_text(encoding="utf-8")

          prototype = replace_once(
              prototype,
              '''function collectNodes(root, predicate) {
            const matches = [];
            function visit(node) {
              if (predicate(node)) matches.push(node);
              ts.forEachChild(node, visit);
            }
            visit(root);
            return matches;
          }
          ''',
              '''function collectNodes(root, predicate) {
            const matches = [];
            function visit(node) {
              if (predicate(node)) matches.push(node);
              ts.forEachChild(node, visit);
            }
            visit(root);
            return matches;
          }

          function findExactlyOne(items, predicate) {
            const matches = items.filter(predicate);
            return matches.length === 1 ? matches[0] : undefined;
          }
          ''',
              "insert findExactlyOne"
          )

          prototype = replace_once(
              prototype,
              '''function branchAction(ifStatement) {
          ''',
              '''function directReturnAction(statement) {
            if (statement.expression === undefined) return "return";
            const expression = unwrap(statement.expression);
            if (ts.isIdentifier(expression) && expression.text === "message") {
              return "return-message";
            }
            if (
              ts.isPropertyAccessExpression(expression) &&
              isIdentifierNamed(expression.expression, "message") &&
              expression.name.text === "attestation"
            ) {
              return "return-attestation";
            }
            return "return";
          }

          function branchAction(ifStatement) {
          ''',
              "insert directReturnAction"
          )

          prototype = replace_once(
              prototype,
              '''    if (ts.isReturnStatement(statement)) {
                terminal = "return";
                continue;
              }
          ''',
              '''    if (ts.isReturnStatement(statement)) {
                terminal = directReturnAction(statement);
                continue;
              }
          ''',
              "classify exact return"
          )

          prototype = replace_once(
              prototype,
              '''function classifyBranch(action, safeAction) {
            if (action === "unsupported") return UNSUPPORTED;
            return action === safeAction ? SAFE : UNSAFE;
          }
          ''',
              '''function classifyBranch(action, safeAction) {
            if (action === "unsupported") return UNSUPPORTED;
            const safeActions = Array.isArray(safeAction) ? safeAction : [safeAction];
            return safeActions.includes(action) ? SAFE : UNSAFE;
          }
          ''',
              "support exact safe action set"
          )

          prototype = replace_once(
              prototype,
              '''  const combined = ifStatements.find((statement) =>
              isCombined404And429(statement.expression)
            );
            if (combined !== undefined) {
          ''',
              '''  const combinedMatches = ifStatements.filter((statement) =>
              isCombined404And429(statement.expression)
            );
            if (combinedMatches.length > 1) {
              return result(UNSUPPORTED, "duplicate-combined-status");
            }
            const combined = combinedMatches[0];
            if (combined !== undefined) {
          ''',
              "combined cardinality"
          )

          replacements = [
              (
                  '''  const branch404 = ifStatements.find((statement) =>
              isResponseStatusAccess(statement.expression, 404)
            );
          ''',
                  '''  const branch404 = findExactlyOne(ifStatements, (statement) =>
              isResponseStatusAccess(statement.expression, 404)
            );
          ''',
                  "404 cardinality"
              ),
              (
                  '''  const branch429 = ifStatements.find((statement) =>
              isResponseStatusAccess(statement.expression, 429)
            );
          ''',
                  '''  const branch429 = findExactlyOne(ifStatements, (statement) =>
              isResponseStatusAccess(statement.expression, 429)
            );
          ''',
                  "429 cardinality"
              ),
              (
                  '''  const branchOther = ifStatements.find((statement) =>
              isResponseNotOk(statement.expression)
            );
          ''',
                  '''  const branchOther = findExactlyOne(ifStatements, (statement) =>
              isResponseNotOk(statement.expression)
            );
          ''',
                  "other status cardinality"
              ),
              (
                  '''  const emptyBranch = ifStatements.find((statement) =>
              isBodyEmpty(statement.expression)
            );
          ''',
                  '''  const emptyBranch = findExactlyOne(ifStatements, (statement) =>
              isBodyEmpty(statement.expression)
            );
          ''',
                  "empty cardinality"
              ),
              (
                  '''  const pendingBranch = ifStatements.find((statement) =>
              isMessagePending(statement.expression)
            );
          ''',
                  '''  const pendingBranch = findExactlyOne(ifStatements, (statement) =>
              isMessagePending(statement.expression)
            );
          ''',
                  "pending cardinality"
              ),
              (
                  '''  const completeBranch = ifStatements.find((statement) =>
              isMessageComplete(statement.expression)
            );
          ''',
                  '''  const completeBranch = findExactlyOne(ifStatements, (statement) =>
              isMessageComplete(statement.expression)
            );
          ''',
                  "complete cardinality"
              )
          ]
          for old, new, label in replacements:
              prototype = replace_once(prototype, old, new, label)

          prototype = replace_once(
              prototype,
              '''    classifyBranch(branchAction(completeBranch), "return")
          ''',
              '''    classifyBranch(branchAction(completeBranch), [
                "return-message",
                "return-attestation"
              ])
          ''',
              "complete exact return"
          )

          prototype_path.write_text(prototype, encoding="utf-8")

          test_path = Path("packages/arcready/test/c08-r3-attestation-prototype.test.mjs")
          test = test_path.read_text(encoding="utf-8")
          test = replace_once(
              test,
              '''function filePathFor(caseId) {
            if (caseId === "R2-S08") return "fixture.js";
            if (caseId === "R2-X26") return "fixture.tsx";
            return "fixture.ts";
          }
          ''',
              '''function filePathFor(caseId) {
            if (caseId === "R2-S08") return "fixture.js";
            if (caseId === "R2-X26") return "fixture.tsx";
            return "fixture.ts";
          }

          function replaceExactlyOnce(source, from, to) {
            const first = source.indexOf(from);
            const last = source.lastIndexOf(from);
            if (first < 0 || first !== last) {
              throw new Error(`Expected exactly one adversarial replacement: ${from}`);
            }
            return source.slice(0, first) + to + source.slice(first + from.length);
          }

          const SAFE_ANCHOR = C08_R3_CASES.find((entry) => entry.id === "R2-A01")?.source;
          if (SAFE_ANCHOR === undefined) throw new Error("Missing C08-R3 safe anchor");

          const SAFE_404_BRANCH = `    if (response.status === 404) {
                await new Promise((resolve) => setTimeout(resolve, 5_000));
                continue;
              }`;
          const SAFE_COMPLETE_BRANCH = `    if (message.status === "complete" && message.attestation) {
                return message;
              }`;
          ''',
              "insert adversarial helpers"
          )

          test = replace_once(
              test,
              '''  it("keeps every unsafe control-flow candidate blocked from public emission", () => {
          ''',
              '''  it("classifies a wrong complete return as unsafe", () => {
            const source = replaceExactlyOnce(
              SAFE_ANCHOR,
              SAFE_COMPLETE_BRANCH,
              `    if (message.status === "complete" && message.attestation) {
                return null;
              }`
            );
            expect(classifyC08R3Source("fixture.ts", source)).toEqual(
              expect.objectContaining({
                controlFlowClass: "unsafe-candidate",
                publicFindingEligibility: "blocked-unvalidated-burn"
              })
            );
          });

          it("fails closed on duplicate owned 404 branches", () => {
            const source = replaceExactlyOnce(
              SAFE_ANCHOR,
              SAFE_404_BRANCH,
              `${SAFE_404_BRANCH}

              if (response.status === 404) {
                throw new Error("Conflicting duplicate 404 branch");
              }`
            );
            expect(classifyC08R3Source("fixture.ts", source).controlFlowClass).toBe(
              "unsupported"
            );
          });

          it("fails closed on duplicate owned complete branches", () => {
            const source = replaceExactlyOnce(
              SAFE_ANCHOR,
              SAFE_COMPLETE_BRANCH,
              `${SAFE_COMPLETE_BRANCH}

              if (message.status === "complete" && message.attestation) {
                return null;
              }`
            );
            expect(classifyC08R3Source("fixture.ts", source).controlFlowClass).toBe(
              "unsupported"
            );
          });

          it("keeps every unsafe control-flow candidate blocked from public emission", () => {
          ''',
              "insert adversarial tests"
          )
          test_path.write_text(test, encoding="utf-8")

          report_path = Path("docs/research/C08-R3.md")
          report = report_path.read_text(encoding="utf-8")
          report = replace_once(
              report,
              "- an attempt, deadline, or abort-aware bound;",
              "- an attempt or deadline bound, with an optional direct abort check;",
              "clarify abort boundary"
          )
          report = replace_once(
              report,
              "| Retry delay and bounded exit     | Pass    | Proven for direct numeric delay and selected bounds.",
              "| Retry delay and bounded exit     | Pass    | Proven for direct numeric delay, attempt/deadline bounds, and optional abort checks.",
              "clarify abort gate"
          )
          report_path.write_text(report, encoding="utf-8")
          PY

      - name: Run focused and full validation
        run: |
          corepack pnpm exec prettier --write \
            docs/research/C08-R3.md \
            docs/research/fixtures/c08-r3-corpus.mjs \
            packages/arcready/test/c08-r3-attestation-prototype.mjs \
            packages/arcready/test/c08-r3-attestation-prototype.test.mjs
          corepack pnpm exec prettier --check \
            docs/research/C08-R3.md \
            docs/research/fixtures/c08-r3-corpus.mjs \
            packages/arcready/test/c08-r3-attestation-prototype.mjs \
            packages/arcready/test/c08-r3-attestation-prototype.test.mjs
          corepack pnpm --filter arcready exec vitest run test/c08-r3-attestation-prototype.test.mjs
          git diff --check

      - name: Commit corrections and self-clean
        run: |
          git rm .github/workflows/c08-r3-review-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/research/C08-R3.md \
            packages/arcready/test/c08-r3-attestation-prototype.mjs \
            packages/arcready/test/c08-r3-attestation-prototype.test.mjs
          git commit -m "test: tighten C08-R3 ownership proof"
          git push origin HEAD:${{ github.head_ref }}
