name: C08A E3 Closeout

on:
  pull_request:

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Move plans and apply closeout patch
        run: |
          git mv docs/exec-plans/active/C08.md docs/exec-plans/completed/C08.md
          git mv docs/exec-plans/active/C08A.md docs/exec-plans/completed/C08A.md
          python3 .github/scripts/c08a-e3-closeout.py

      - name: Format and validate closeout docs
        run: |
          corepack pnpm exec prettier --write \
            docs/exec-plans/completed/C08.md \
            docs/exec-plans/completed/C08A.md \
            docs/roadmap.md \
            docs/rule-development-backlog.md
          corepack pnpm exec prettier --check \
            docs/exec-plans/completed/C08.md \
            docs/exec-plans/completed/C08A.md \
            docs/roadmap.md \
            docs/rule-development-backlog.md
          git diff --check

      - name: Run full repository gate
        run: corepack pnpm verify:full

      - name: Commit closeout and self-clean
        run: |
          git rm \
            .github/workflows/c08a-e3-closeout.yml \
            .github/scripts/c08a-e3-closeout.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: close C08 and C08A"
          git push origin HEAD:${{ github.head_ref }}
